<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <link id="main-stylesheet" rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {%- feed_meta -%}
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}
</head>

<body>

  <div class="header">
    <div class="container">
    {%- if page.url contains 'quotes' -%}
       <a rel="author" href="{{ '/' | relative_url }}">佛經</a>
       <a href="/quotes" style="font-weight: bold;">摘經</a>
    {% else -%}
       <a rel="author" href="{{ '/' | relative_url }}" style="font-weight: bold;">佛經</a>
       <a href="/quotes">摘經</a>
    {% endif -%}
    </div>
  </div>

  <div aria-label="Content" class="content">
    <div  class="container">
      {{ content }}
    </div>
  </div>

  <div class="footer">
    <div class="container" style="padding-bottom: 0;">
      <data value="{{ '/' | relative_url }}"></data>
      <div>&copy;2026 {{ site.title | escape }}</div>
    </div>
  </div>

</body>

</html>
