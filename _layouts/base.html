<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <link id="main-stylesheet" rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {%- feed_meta -%}
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}
</head>

<body>

  <div>
   
    {%- if page.url contains 'quotes' -%}
       <a rel="author" href="{{ '/' | relative_url }}">佛經</a>&nbsp;
       <strong>摘經</strong>
    {% else -%}
       <strong>佛經</strong>&nbsp;
       <a href="/quotes">摘經</a>
    {% endif -%}
    <hr>
  </div>

  <div aria-label="Content">
    {{ content }}
  </div>

  <div>
    <data value="{{ '/' | relative_url }}"></data>
    <div>&copy;2026 {{ site.title | escape }}</div>
  </div>

</body>

</html>
