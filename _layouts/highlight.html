---
layout: base
---

<p class="breadcrumb">
  <span>摘经</span>
  <span>/</span>
  <span>{{ page.title }}</span>
</p>

<div itemscope itemtype="http://schema.org/BlogPosting">

  {%- assign date_format = site.minima.date_format | default: "%Y/%-d/b" -%}

  <p>{{ page.title }}<span>{{ page.date | date: date_format }}</span></p>

  {%- include note.html -%}

  {{ content }}

  <a href="{{ page.url | relative_url }}" hidden></a>

</div>
